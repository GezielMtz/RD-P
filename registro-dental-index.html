<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Consultorio">
<meta name="theme-color" content="#FF4FA3">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23FF4FA3'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle'%3E%F0%9F%A6%B7%3C/text%3E%3C/svg%3E">
<title>Registro Dental</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FFF0F6;
    --paper: #FFFFFF;
    --ink: #5A2A44;
    --ink-soft: #A5677F;
    --line: #F7D6E6;

    --primary: #FF4FA3;
    --primary-dark: #D6357F;
    --primary-soft: #FFE1F0;
    --accent: #F5C451;
    --accent-soft: #FFF3D6;

    --alert: #E8557A;
    --alert-soft: #FCE1E7;

    --radius: 18px;
    --font-display: 'Quicksand', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--ink); font-family:var(--font-body); min-height:100vh; -webkit-font-smoothing:antialiased; padding-bottom:100px; }
  #app{ max-width:480px; margin:0 auto; min-height:100vh; position:relative; }

  .loading-screen{ display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; gap:14px; }
  .coin{ width:46px; height:46px; border-radius:50%; border:3px solid var(--primary); border-top-color:transparent; animation:spin 0.9s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  .loading-screen p{ color:var(--ink-soft); font-size:14px; }

  header{ padding:26px 20px 14px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .tooth{ font-size:26px; }
  .brand h1{ font-family:var(--font-display); font-size:18px; font-weight:800; margin:0; letter-spacing:-0.01em; }
  .icon-btn{ width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:var(--paper); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; color:var(--ink); }
  .icon-btn:active{ transform:scale(0.94); }
  .header-actions{ display:flex; gap:8px; }
  .period-toggle{ flex:1; padding:9px 12px; border-radius:10px; border:1.5px solid var(--line); background:#fff; font-size:12.5px; font-weight:700; cursor:pointer; color:var(--ink-soft); text-align:center; }
  .period-toggle.active{ background:var(--primary); color:#fff; border-color:transparent; }

  .pay-card{ margin:0 20px 14px; padding:20px; background:linear-gradient(155deg, var(--primary) 0%, var(--primary-dark) 100%); border-radius:var(--radius); color:#fff; position:relative; overflow:hidden; }
  .pay-card::after{ content:''; position:absolute; inset:0; background:linear-gradient(115deg, transparent 20%, rgba(255,255,255,0.28) 35%, transparent 50%); animation:shimmer 3.2s ease-in-out infinite; pointer-events:none; }
  @keyframes shimmer{ 0%{ transform:translateX(-60%);} 55%,100%{ transform:translateX(60%);} }
  .pay-card .sparkle{ position:absolute; top:12px; right:16px; font-size:20px; opacity:0.9; z-index:1; }
  .pay-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .pay-nav button{ background:rgba(255,255,255,0.16); border:1px solid rgba(255,255,255,0.35); color:#fff; width:30px; height:30px; border-radius:8px; cursor:pointer; font-size:14px; }
  .pay-nav .range{ font-size:12px; font-weight:600; opacity:0.95; text-align:center; flex:1; }
  .pay-sub{ font-size:11.5px; opacity:0.85; margin:0 0 14px; }
  .pay-rows{ display:flex; flex-direction:column; gap:6px; margin-bottom:10px; font-size:13px; }
  .pay-rows .r{ display:flex; justify-content:space-between; opacity:0.92; }
  .pay-rows .r span:last-child{ font-family:var(--font-mono); }
  .pay-total{ display:flex; justify-content:space-between; align-items:baseline; padding-top:12px; border-top:1px solid rgba(255,255,255,0.25); }
  .pay-total .lbl{ font-size:12.5px; opacity:0.9; font-weight:600; }
  .pay-total .amt{ font-family:var(--font-display); font-size:26px; font-weight:800; }

  .stat-row{ display:flex; gap:10px; padding:0 20px; margin-bottom:18px; }
  .stat-card{ flex:1; background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:14px; cursor:pointer; }
  .stat-card .lbl{ font-size:11px; color:var(--ink-soft); font-weight:600; text-transform:uppercase; letter-spacing:0.04em; margin:0 0 4px; }
  .stat-card .val{ font-family:var(--font-mono); font-size:17px; font-weight:600; }

  .section-title{ font-family:var(--font-display); font-size:15px; font-weight:800; margin:22px 20px 10px; letter-spacing:-0.01em; }
  .day-group{ padding:0 20px; margin-bottom:6px; }
  .day-heading{ font-size:12px; font-weight:700; color:var(--ink-soft); margin:14px 0 8px; text-transform:uppercase; letter-spacing:0.03em; }
  .day-heading:first-child{ margin-top:0; }
  .entry-row{ background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:12px 14px; display:flex; align-items:center; gap:12px; margin-bottom:8px; }
  .entry-dot{ width:9px; height:9px; border-radius:50%; background:var(--accent); flex-shrink:0; }
  .entry-mid{ flex:1; min-width:0; }
  .entry-name{ font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .entry-sub{ font-size:11.5px; color:var(--ink-soft); }
  .entry-amt{ font-family:var(--font-mono); font-weight:600; font-size:14px; flex-shrink:0; }
  .entry-del{ border:none; background:none; color:var(--ink-soft); cursor:pointer; font-size:16px; padding:2px 2px 2px 6px; }
  .empty-note{ font-size:12.5px; color:var(--ink-soft); padding:6px 4px 12px; }

  .fab-row{ position:fixed; bottom:26px; left:50%; transform:translateX(-50%); width:calc(100% - 40px); max-width:440px; display:flex; gap:10px; z-index:40; }
  .fab{ flex:1; background:linear-gradient(135deg, var(--primary), var(--primary-dark)); color:#fff; border:none; border-radius:16px; padding:16px; font-family:var(--font-body); font-weight:700; font-size:15px; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; box-shadow:0 8px 24px rgba(255,79,163,0.35); }
  .fab:active{ transform:scale(0.98); }
  .fab-secondary{ width:56px; flex-shrink:0; background:var(--paper); border:1.5px solid var(--alert); color:var(--alert); border-radius:16px; font-size:22px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .fab-secondary:active{ transform:scale(0.94); }

  .overlay{ position:fixed; inset:0; background:rgba(15,35,38,0.45); display:flex; align-items:flex-end; justify-content:center; z-index:100; animation:fadeIn .15s ease; }
  @keyframes fadeIn{ from{opacity:0} to{opacity:1} }
  .overlay.center{ align-items:center; padding:20px; }
  .sheet{ background:var(--paper); width:100%; max-width:480px; border-radius:22px 22px 0 0; padding:22px 20px 28px; max-height:88vh; overflow-y:auto; animation:slideUp .2s cubic-bezier(.2,.8,.3,1); position:relative; }
  .overlay.center .sheet{ border-radius:20px; max-width:400px; }
  @keyframes slideUp{ from{ transform:translateY(24px); opacity:0 } to{ transform:translateY(0); opacity:1 } }
  .sheet h2{ font-family:var(--font-display); font-size:19px; font-weight:800; margin:0 0 16px; letter-spacing:-0.01em; }
  .sheet h3{ font-family:var(--font-display); font-size:15px; font-weight:800; margin:0 0 10px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; color:var(--ink-soft); margin-bottom:6px; font-weight:600; }
  .field input, .field select{ width:100%; padding:12px 13px; border:1px solid var(--line); border-radius:12px; font-size:15px; font-family:var(--font-body); background:#fff; color:var(--ink); }
  .field input:focus, .field select:focus{ outline:2px solid var(--primary); outline-offset:1px; }
  .field .hint{ font-size:11.5px; color:var(--ink-soft); margin-top:5px; }
  .row-2{ display:flex; gap:10px; }
  .row-2 > *{ flex:1; min-width:0; }
  .svc-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px; }
  .svc-btn{ text-align:left; border:1.5px solid var(--line); background:#fff; border-radius:12px; padding:10px 12px; cursor:pointer; }
  .svc-btn .n{ font-size:12.5px; font-weight:700; display:block; margin-bottom:2px; }
  .svc-btn .p{ font-size:11.5px; color:var(--ink-soft); font-family:var(--font-mono); }
  .svc-btn.active{ border-color:var(--primary); background:var(--primary-soft); }
  .svc-btn.other{ display:flex; align-items:center; justify-content:center; color:var(--ink-soft); font-weight:700; font-size:12.5px; }
  .btn-primary{ width:100%; padding:14px; border:none; border-radius:12px; background:var(--ink); color:#fff; font-size:15px; font-weight:700; cursor:pointer; margin-top:6px; font-family:var(--font-body); }
  .btn-primary:disabled{ opacity:0.4; cursor:not-allowed; }
  .btn-secondary{ width:100%; padding:13px; border:1px solid var(--line); border-radius:12px; background:transparent; color:var(--ink); font-size:14px; font-weight:600; cursor:pointer; margin-top:8px; font-family:var(--font-body); }
  .btn-danger{ width:100%; padding:13px; border:1px solid var(--alert); border-radius:12px; background:transparent; color:var(--alert); font-size:14px; font-weight:600; cursor:pointer; margin-top:8px; font-family:var(--font-body); }
  .sheet-close{ position:absolute; top:16px; right:18px; border:none; background:none; font-size:20px; color:var(--ink-soft); cursor:pointer; }
  .list-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px; }
  .list-row .ci .n{ font-size:13.5px; font-weight:700; }
  .list-row .ci .s{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; font-family:var(--font-mono); }
  .list-row button{ border:1px solid var(--line); background:#fff; border-radius:8px; padding:6px 10px; font-size:12px; color:var(--ink); cursor:pointer; flex-shrink:0; }
  hr.sep{ border:none; border-top:1px solid var(--line); margin:18px 0; }
  .totalline{ font-size:13px; color:var(--ink-soft); margin-bottom:14px; }
  .totalline b{ color:var(--ink); font-family:var(--font-mono); }
  .breakdown-row{ display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .breakdown-row:last-child{ border-bottom:none; }
  .breakdown-row .amt{ font-family:var(--font-mono); font-weight:600; }
  .install-note{ margin:0 20px 14px; padding:12px 14px; background:var(--accent-soft); color:var(--primary-dark); border-radius:14px; font-size:12.5px; line-height:1.5; }
  .install-note b{ display:block; margin-bottom:2px; font-size:13px;}
  .close-note-btn{ float:right; border:none; background:none; color:var(--primary-dark); cursor:pointer; font-size:15px; }
</style>
</head>
<body>
<div id="app"><div class="loading-screen"><div class="coin"></div><p>Cargando…</p></div></div>

<script>
(function(){
  "use strict";

  const DEFAULT_SERVICES = [
    { name:'Ajustes', price:45 },
    { name:'Inicio Ortodoncia', price:120 },
    { name:'Colocación Inf. con Topes', price:300 },
    { name:'Limpiezas', price:120 },
    { name:'Limpieza Profunda', price:300 },
    { name:'Recordatorios', price:600 },
    { name:'Hyrax', price:250 },
    { name:'Retiros', price:360 }
  ];
  const WEEKDAY_NAMES = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const MONTH_NAMES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

  const fmt = new Intl.NumberFormat('es-MX', { style:'currency', currency:'MXN', maximumFractionDigits:0 });
  const fmt2 = new Intl.NumberFormat('es-MX', { style:'currency', currency:'MXN', maximumFractionDigits:2 });

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function startOfToday(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
  function isoOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function fromISO(iso){ const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); }
  function addDays(d, n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
  function fmtShort(d){ return d.getDate()+' '+MONTH_NAMES[d.getMonth()].slice(0,3); }
  function fmtLong(d){ return d.getDate()+' de '+MONTH_NAMES[d.getMonth()]; }
  function fmtDayHeading(iso){
    const d = fromISO(iso);
    const today = startOfToday();
    const diff = Math.round((today - d)/86400000);
    if(diff===0) return 'Hoy · '+WEEKDAY_NAMES[d.getDay()]+' '+fmtLong(d);
    if(diff===1) return 'Ayer · '+WEEKDAY_NAMES[d.getDay()]+' '+fmtLong(d);
    return WEEKDAY_NAMES[d.getDay()]+' '+fmtLong(d);
  }

  function sGet(key){ try{ const raw = localStorage.getItem(key); return raw!==null ? JSON.parse(raw) : null; }catch(e){ return null; } }
  function sSet(key, value){ try{ localStorage.setItem(key, JSON.stringify(value)); return true; }catch(e){ console.error(e); return false; } }

  let state = {
    global: null,
    entries: [],
    modal: null,
    draft: null,
    dayOffset: 0,
    weekOffset: 0,
    quincenaOffset: 0,
    monthOffset: 0,
    showInstallNote: true
  };

  function loadAll(){
    let global = sGet('dental_global');
    if(!global){ global = { services: DEFAULT_SERVICES.map(s=>({id:uid(), name:s.name, price:s.price})), paydayWeekday: 5, baseSalary: 1500, onboarded:false }; }
    if(!global.services) global.services = DEFAULT_SERVICES.map(s=>({id:uid(), name:s.name, price:s.price}));
    if(global.paydayWeekday==null) global.paydayWeekday = 5;
    if(global.baseSalary==null) global.baseSalary = 1500;
    if(global.absenceDiscount==null) global.absenceDiscount = 250;
    state.global = global;
    state.entries = sGet('dental_entries') || [];
    state.absences = sGet('dental_absences') || [];
  }
  function saveGlobal(){ sSet('dental_global', state.global); }
  function saveEntries(){ sSet('dental_entries', state.entries); }
  function saveAbsences(){ sSet('dental_absences', state.absences); }

  function entriesInRange(startISO, endISO){
    return state.entries.filter(e => e.date >= startISO && e.date <= endISO);
  }
  function absencesInRange(startISO, endISO){
    return state.absences.filter(a => a.date >= startISO && a.date <= endISO);
  }
  function sumEntries(list){ return list.reduce((s,e)=>s+e.price,0); }
  function countPaydaysInRange(startISO, endISO, weekday){
    let d = fromISO(startISO); const end = fromISO(endISO); let count=0;
    while(d <= end){ if(d.getDay()===weekday) count++; d = addDays(d,1); }
    return count;
  }

  function currentPayCycle(offset){
    const wd = state.global.paydayWeekday;
    let d = new Date(startOfToday());
    while(d.getDay() !== wd) d = addDays(d,1);
    d = addDays(d, offset*7);
    const end = new Date(d);
    const start = addDays(end, -6);
    return { start, end, startISO: isoOf(start), endISO: isoOf(end) };
  }
  function currentMonthRange(offset){
    const base = new Date(); base.setDate(1);
    const y = base.getFullYear(), m = base.getMonth() + offset;
    const start = new Date(y, m, 1);
    const end = new Date(y, m+1, 0);
    return { start, end, startISO: isoOf(start), endISO: isoOf(end), label: MONTH_NAMES[start.getMonth()]+' de '+start.getFullYear() };
  }
  function dayRange(offset){
    const d = addDays(startOfToday(), offset);
    return { date: d, startISO: isoOf(d), endISO: isoOf(d) };
  }
  function currentQuincenaRange(offset){
    const now = new Date();
    const half0 = now.getDate() <= 15 ? 0 : 1;
    let totalIndex = now.getFullYear()*24 + now.getMonth()*2 + half0 + offset;
    let y = Math.floor(totalIndex/24);
    let rem = totalIndex - y*24;
    if(rem < 0){ rem += 24; y -= 1; }
    const m = Math.floor(rem/2);
    const half = rem % 2;
    let start, end, label;
    if(half===0){ start = new Date(y,m,1); end = new Date(y,m,15); label = '1ª quincena de '+MONTH_NAMES[m]+' '+y; }
    else{ start = new Date(y,m,16); end = new Date(y,m+1,0); label = '2ª quincena de '+MONTH_NAMES[m]+' '+y; }
    return { start, end, startISO: isoOf(start), endISO: isoOf(end), label };
  }
  function nextPaydayInfo(){
    const cyc = currentPayCycle(0);
    const days = Math.round((cyc.end - startOfToday())/86400000);
    return { date: cyc.end, days };
  }

  function render(){
    const app = document.getElementById('app');
    if(!state.global.onboarded){ app.innerHTML = renderOnboarding(); bindOnboarding(); return; }

    let html = '';
    html += renderHeader();
    if(state.showInstallNote){
      html += `<div class="install-note"><button class="close-note-btn" data-close-install>×</button><b>Instálala en el teléfono</b>Desde Safari/Chrome: compartir → "Agregar a pantalla de inicio". Tus datos se guardan en este navegador.</div>`;
    }
    html += renderPayCard();
    html += renderStatRow();
    html += renderMovements();
    html += `<div class="fab-row"><button class="fab" data-open-add>+ &nbsp;Registrar servicio</button><button class="fab-secondary" data-open-absence aria-label="Marcar falta">🚫</button></div>`;

    if(state.modal){
      const t = state.modal.type;
      if(t==='add') html += renderAddSheet();
      if(t==='settings') html += renderSettingsSheet();
      if(t==='service') html += renderServiceModal();
      if(t==='payday') html += renderPaydayModal();
      if(t==='absence') html += renderAbsenceModal();
      if(t==='weekDetail') html += renderWeekDetail();
      if(t==='monthDetail') html += renderMonthDetail();
      if(t==='dayDetail') html += renderDayDetail();
      if(t==='quincenaDetail') html += renderQuincenaDetail();
      if(t==='servicePick') html += renderServicePick();
      if(t==='serviceDetail') html += renderServiceDetail();
    }

    app.innerHTML = html;
    bindEvents();
  }

  function renderHeader(){
    return `<header>
      <div class="brand"><span class="tooth">🦷</span><h1>Registro Dental</h1><span style="font-size:15px;">✨</span></div>
      <div class="header-actions">
        <button class="icon-btn" data-open-service-pick aria-label="Ver por servicio">🔍</button>
        <button class="icon-btn" data-open-settings aria-label="Ajustes">⚙</button>
      </div>
    </header>`;
  }

  function renderPayCard(){
    const cyc = currentPayCycle(state.weekOffset);
    const commissions = sumEntries(entriesInRange(cyc.startISO, cyc.endISO));
    const absences = absencesInRange(cyc.startISO, cyc.endISO);
    const deduction = absences.length * state.global.absenceDiscount;
    const total = state.global.baseSalary - deduction + commissions;
    const pd = nextPaydayInfo();
    const payTxt = state.weekOffset===0
      ? (pd.days===0 ? 'Se paga hoy' : pd.days===1 ? 'Se paga mañana' : `Se paga en ${pd.days} días`)
      : `Pago del ${fmtShort(cyc.end)}`;
    return `<div class="pay-card" data-open-week>
      <span class="sparkle">✨</span>
      <div class="pay-nav" style="position:relative;z-index:1;">
        <button data-week-nav="-1">‹</button>
        <span class="range">${fmtShort(cyc.start)} – ${fmtShort(cyc.end)}</span>
        <button data-week-nav="1">›</button>
      </div>
      <p class="pay-sub" style="position:relative;z-index:1;">${payTxt} · cada ${WEEKDAY_NAMES[state.global.paydayWeekday]}</p>
      <div class="pay-rows" style="position:relative;z-index:1;">
        <div class="r"><span>Sueldo base</span><span>${fmt.format(state.global.baseSalary)}</span></div>
        ${absences.length ? `<div class="r"><span>Faltas (${absences.length} × -${fmt.format(state.global.absenceDiscount)})</span><span>-${fmt.format(deduction)}</span></div>` : ''}
        <div class="r"><span>Comisiones (${entriesInRange(cyc.startISO,cyc.endISO).length} servicios)</span><span>${fmt.format(commissions)}</span></div>
      </div>
      <div class="pay-total" style="position:relative;z-index:1;"><span class="lbl">Total a pagar</span><span class="amt">${fmt.format(total)}</span></div>
    </div>`;
  }

  function renderStatRow(){
    const today = todayISO();
    const todayTotal = sumEntries(entriesInRange(today, today));
    const q = currentQuincenaRange(state.quincenaOffset);
    const qCommissions = sumEntries(entriesInRange(q.startISO, q.endISO));
    const qPaydays = countPaydaysInRange(q.startISO, q.endISO, state.global.paydayWeekday);
    const qAbsences = absencesInRange(q.startISO, q.endISO).length;
    const qTotal = qCommissions + qPaydays*state.global.baseSalary - qAbsences*state.global.absenceDiscount;
    const mon = currentMonthRange(state.monthOffset);
    const monCommissions = sumEntries(entriesInRange(mon.startISO, mon.endISO));
    const paydays = countPaydaysInRange(mon.startISO, mon.endISO, state.global.paydayWeekday);
    const monAbsences = absencesInRange(mon.startISO, mon.endISO).length;
    const monTotal = monCommissions + paydays*state.global.baseSalary - monAbsences*state.global.absenceDiscount;
    return `<div class="stat-row">
      <div class="stat-card" data-open-day><p class="lbl">Hoy</p><p class="val">${fmt.format(todayTotal)}</p></div>
      <div class="stat-card" data-open-quincena><p class="lbl">Quincena</p><p class="val">${fmt.format(qTotal)}</p></div>
      <div class="stat-card" data-open-month><p class="lbl">${mon.label.charAt(0).toUpperCase()+mon.label.slice(1)}</p><p class="val">${fmt.format(monTotal)}</p></div>
    </div>`;
  }

  function renderMovements(){
    const cyc = currentPayCycle(0);
    const rangeEnd = todayISO() > cyc.endISO ? todayISO() : cyc.endISO;
    const svcList = entriesInRange(cyc.startISO, rangeEnd).map(e=>({ kind:'service', date:e.date, id:e.id, label:e.serviceName, sub:e.patient, amt:e.price }));
    const absList = absencesInRange(cyc.startISO, rangeEnd).map(a=>({ kind:'absence', date:a.date, id:a.id, label:'Falta', sub:null, amt:-state.global.absenceDiscount }));
    const list = [...svcList, ...absList].sort((a,b)=>b.date.localeCompare(a.date) || String(b.id).localeCompare(String(a.id)));
    let out = `<h2 class="section-title">Movimientos recientes</h2>`;
    if(list.length===0){ out += `<div class="day-group"><div class="empty-note">Aún no registras nada esta semana.</div></div>`; return out; }
    let lastDate = null;
    out += `<div class="day-group">`;
    for(const item of list){
      if(item.date !== lastDate){ out += `<div class="day-heading">${fmtDayHeading(item.date)}</div>`; lastDate = item.date; }
      const isAbsence = item.kind==='absence';
      out += `<div class="entry-row">
        <span class="entry-dot" style="${isAbsence?'background:var(--alert)':''}"></span>
        <div class="entry-mid"><div class="entry-name">${escapeHtml(item.label)}</div>${item.sub?`<div class="entry-sub">${escapeHtml(item.sub)}</div>`:''}</div>
        <span class="entry-amt" style="${isAbsence?'color:var(--alert)':''}">${isAbsence?'-':''}${fmt2.format(Math.abs(item.amt))}</span>
        <button class="entry-del" data-del-${isAbsence?'absence':'entry'}="${item.id}" aria-label="Eliminar">✕</button>
      </div>`;
    }
    out += `</div>`;
    return out;
  }

  function serviceBreakdownHtml(list, periodType, offset){
    const byService = {};
    for(const e of list){ byService[e.serviceName] = byService[e.serviceName] || {count:0, sub:0}; byService[e.serviceName].count++; byService[e.serviceName].sub += e.price; }
    const names = Object.keys(byService);
    if(!names.length) return '<p style="font-size:13px;color:var(--ink-soft);">Sin servicios en este periodo.</p>';
    return names.map(name=>`<div class="breakdown-row" data-view-service="${escapeAttr(name)}" data-view-period="${periodType}" data-view-offset="${offset}" style="cursor:pointer;"><span>${escapeHtml(name)} × ${byService[name].count}</span><span class="amt">${fmt.format(byService[name].sub)}</span></div>`).join('');
  }

    else { const mo = currentMonthRange(m.offset); range=mo; label=mo.label.charAt(0).toUpperCase()+mo.label.slice(1); }

  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function escapeAttr(s){ return escapeHtml(s); }

  function bindOnboarding(){
    document.querySelector('[data-submit-onboarding]').addEventListener('click', ()=>{
      const salary = parseFloat(document.getElementById('ob-salary').value)||0;
      const dateVal = document.getElementById('ob-payday').value || todayISO();
      const weekday = fromISO(dateVal).getDay();
      state.global.baseSalary = salary;
      state.global.paydayWeekday = weekday;
      state.global.onboarded = true;
      saveGlobal();
      render();
    });
  }

  function bindEvents(){
    const app = document.getElementById('app');

    const closeInstall = app.querySelector('[data-close-install]');
    if(closeInstall) closeInstall.addEventListener('click', ()=>{ state.showInstallNote=false; render(); });

    app.querySelectorAll('[data-week-nav]').forEach(el=>{
      el.addEventListener('click', (ev)=>{ ev.stopPropagation(); state.weekOffset += parseInt(el.getAttribute('data-week-nav')); render(); });
    });
    app.querySelectorAll('[data-month-nav]').forEach(el=>{
      el.addEventListener('click', (ev)=>{ ev.stopPropagation(); state.monthOffset += parseInt(el.getAttribute('data-month-nav')); render(); });
    });
    app.querySelectorAll('[data-day-nav]').forEach(el=>{
      el.addEventListener('click', (ev)=>{ ev.stopPropagation(); state.dayOffset += parseInt(el.getAttribute('data-day-nav')); render(); });
    });
    app.querySelectorAll('[data-quincena-nav]').forEach(el=>{
      el.addEventListener('click', (ev)=>{ ev.stopPropagation(); state.quincenaOffset += parseInt(el.getAttribute('data-quincena-nav')); render(); });
    });

    const openWeek = app.querySelector('[data-open-week]');
    if(openWeek) openWeek.addEventListener('click', ()=>{ state.modal={type:'weekDetail'}; render(); });
    const openDay = app.querySelector('[data-open-day]');
    if(openDay) openDay.addEventListener('click', ()=>{ state.modal={type:'dayDetail'}; render(); });
    const openQuincena = app.querySelector('[data-open-quincena]');
    if(openQuincena) openQuincena.addEventListener('click', ()=>{ state.modal={type:'quincenaDetail'}; render(); });
    const openMonth = app.querySelector('[data-open-month]');
    if(openMonth) openMonth.addEventListener('click', ()=>{ state.modal={type:'monthDetail'}; render(); });

    const openServicePick = app.querySelector('[data-open-service-pick]');
    if(openServicePick) openServicePick.addEventListener('click', ()=>{ state.modal={type:'servicePick'}; render(); });
    app.querySelectorAll('[data-pick-service-filter]').forEach(el=>{
      el.addEventListener('click', ()=>{
        state.modal = { type:'serviceDetail', serviceName: el.getAttribute('data-pick-service-filter'), periodType:'week', offset:0 };
        render();
      });
    });
    app.querySelectorAll('[data-view-service]').forEach(el=>{
      el.addEventListener('click', ()=>{
        state.modal = { type:'serviceDetail', serviceName: el.getAttribute('data-view-service'), periodType: el.getAttribute('data-view-period'), offset: parseInt(el.getAttribute('data-view-offset')) };
        render();
      });
    });
    app.querySelectorAll('[data-set-period]').forEach(el=>{
      el.addEventListener('click', ()=>{
        state.modal.periodType = el.getAttribute('data-set-period');
        state.modal.offset = 0;
        render();
      });
    });
    app.querySelectorAll('[data-svc-nav]').forEach(el=>{
      el.addEventListener('click', ()=>{ state.modal.offset += parseInt(el.getAttribute('data-svc-nav')); render(); });
    });

    const settingsBtn = app.querySelector('[data-open-settings]');
    if(settingsBtn) settingsBtn.addEventListener('click', ()=>{ state.modal={type:'settings'}; render(); });

    const openAdd = app.querySelector('[data-open-add]');
    if(openAdd) openAdd.addEventListener('click', ()=>{ state.draft={ patient:'', date: todayISO(), items:[], otherOpen:false }; state.modal={type:'add'}; render(); });

    const openAbsence = app.querySelector('[data-open-absence]');
    if(openAbsence) openAbsence.addEventListener('click', ()=>{ state.modal={type:'absence'}; render(); });
    const submitAbsence = app.querySelector('[data-submit-absence]');
    if(submitAbsence) submitAbsence.addEventListener('click', ()=>{
      const date = document.getElementById('ab-date').value || todayISO();
      if(state.absences.some(a=>a.date===date)){ alert('Ya está marcada como falta ese día.'); return; }
      state.absences.push({ id: uid(), date });
      saveAbsences();
      state.modal = null;
      render();
    });
    app.querySelectorAll('[data-del-absence]').forEach(el=>{
      el.addEventListener('click', ()=>{
        if(confirm('¿Quitar esta falta?')){
          state.absences = state.absences.filter(a=>a.id!==el.getAttribute('data-del-absence'));
          saveAbsences(); render();
        }
      });
    });
    const editAbsenceDiscountBtn = app.querySelector('[data-edit-absence-discount]');
    if(editAbsenceDiscountBtn) editAbsenceDiscountBtn.addEventListener('click', ()=>{
      const v = parseFloat(prompt('Nuevo descuento por falta:', state.global.absenceDiscount));
      if(!isNaN(v) && v>=0){ state.global.absenceDiscount = v; saveGlobal(); render(); }
    });

    app.querySelectorAll('[data-del-entry]').forEach(el=>{
      el.addEventListener('click', ()=>{
        if(confirm('¿Eliminar este movimiento?')){
          state.entries = state.entries.filter(e=>e.id!==el.getAttribute('data-del-entry'));
          saveEntries(); render();
        }
      });
    });

    const overlay = app.querySelector('[data-close-overlay]');
    if(overlay){
      overlay.addEventListener('click', ()=>{ state.modal=null; state.draft=null; render(); });
      const stop = app.querySelector('[data-stop]');
      if(stop) stop.addEventListener('click', ev=>ev.stopPropagation());
    }
    const closeModalBtn = app.querySelector('[data-close-modal]');
    if(closeModalBtn) closeModalBtn.addEventListener('click', ()=>{ state.modal=null; state.draft=null; render(); });

    // add sheet — multi-select treatments
    function captureAddDraft(){
      if(!state.draft) state.draft = { patient:'', date: todayISO(), items:[], otherOpen:false };
      const patient = document.getElementById('a-patient');
      const date = document.getElementById('a-date');
      if(patient) state.draft.patient = patient.value;
      if(date) state.draft.date = date.value;
    }
    app.querySelectorAll('[data-toggle-service]').forEach(el=>{
      el.addEventListener('click', ()=>{
        captureAddDraft();
        const id = el.getAttribute('data-toggle-service');
        const svc = state.global.services.find(s=>s.id===id);
        const idx = state.draft.items.findIndex(i=>i.key===id);
        if(idx>=0) state.draft.items.splice(idx,1);
        else state.draft.items.push({ key:id, name:svc.name, price:svc.price });
        render();
      });
    });
    const toggleOther = app.querySelector('[data-toggle-other]');
    if(toggleOther) toggleOther.addEventListener('click', ()=>{ captureAddDraft(); state.draft.otherOpen = !state.draft.otherOpen; render(); });
    const addOtherItemBtn = app.querySelector('[data-add-other-item]');
    if(addOtherItemBtn) addOtherItemBtn.addEventListener('click', ()=>{
      captureAddDraft();
      const name = document.getElementById('a-other-name').value.trim();
      const price = parseFloat(document.getElementById('a-other-price').value);
      if(!name){ alert('Escribe el nombre del tratamiento.'); return; }
      if(!price || price<0){ alert('Ingresa un precio válido.'); return; }
      state.draft.items.push({ key:'custom-'+uid(), name, price });
      state.draft.otherOpen = false;
      render();
    });
    app.querySelectorAll('[data-remove-item]').forEach(el=>{
      el.addEventListener('click', ()=>{
        captureAddDraft();
        state.draft.items = state.draft.items.filter(i=>i.key!==el.getAttribute('data-remove-item'));
        render();
      });
    });
    app.querySelectorAll('input[id^="ip-"]').forEach(el=>{
      el.addEventListener('input', ()=>{
        let total = 0;
        app.querySelectorAll('input[id^="ip-"]').forEach(inp=>{ total += parseFloat(inp.value)||0; });
        const totalLine = document.getElementById('add-total-line');
        if(totalLine) totalLine.innerHTML = 'Total: <b>'+fmt.format(total)+'</b>';
      });
    });
    const submitEntry = app.querySelector('[data-submit-entry]');
    if(submitEntry) submitEntry.addEventListener('click', ()=>{
      const patient = document.getElementById('a-patient').value.trim();
      const date = document.getElementById('a-date').value || todayISO();
      if(!state.draft || state.draft.items.length===0){ alert('Selecciona al menos un tratamiento.'); return; }
      if(!patient){ alert('Escribe el nombre del paciente.'); return; }
      for(const item of state.draft.items){
        const input = document.getElementById('ip-'+item.key);
        const price = input ? (parseFloat(input.value)||0) : item.price;
        state.entries.push({ id: uid(), date, serviceId: item.key.indexOf('custom-')===0 ? null : item.key, serviceName: item.name, price, patient: patient||null });
      }
      saveEntries();
      state.modal = null; state.draft = null;
      render();
    });

    // settings
    const editSalaryBtn = app.querySelector('[data-edit-salary]');
    if(editSalaryBtn) editSalaryBtn.addEventListener('click', ()=>{
      const v = parseFloat(prompt('Nuevo sueldo base semanal:', state.global.baseSalary));
      if(!isNaN(v) && v>=0){ state.global.baseSalary = v; saveGlobal(); render(); }
    });
    const openPaydayBtn = app.querySelector('[data-open-payday]');
    if(openPaydayBtn) openPaydayBtn.addEventListener('click', ()=>{ state.modal={type:'payday'}; render(); });
    const submitPayday = app.querySelector('[data-submit-payday]');
    if(submitPayday) submitPayday.addEventListener('click', ()=>{
      const v = document.getElementById('pd-date').value;
      if(!v){ alert('Elige una fecha.'); return; }
      state.global.paydayWeekday = fromISO(v).getDay();
      saveGlobal();
      state.modal = { type:'settings' };
      render();
    });

    const addServiceOpen = app.querySelector('[data-add-service-open]');
    if(addServiceOpen) addServiceOpen.addEventListener('click', ()=>{ state.modal={type:'service', serviceId:null}; render(); });
    app.querySelectorAll('[data-edit-service]').forEach(el=>{
      el.addEventListener('click', ()=>{ state.modal={type:'service', serviceId: el.getAttribute('data-edit-service')}; render(); });
    });
    const submitService = app.querySelector('[data-submit-service]');
    if(submitService) submitService.addEventListener('click', ()=>{
      const name = document.getElementById('sv-name').value.trim();
      const price = parseFloat(document.getElementById('sv-price').value);
      if(!name){ alert('Ponle un nombre al servicio.'); return; }
      if(!price || price<0){ alert('Ingresa un precio válido.'); return; }
      if(state.modal.serviceId){
        const s = state.global.services.find(x=>x.id===state.modal.serviceId);
        s.name = name; s.price = price;
      }else{
        state.global.services.push({ id:uid(), name, price });
      }
      saveGlobal();
      state.modal = { type:'settings' };
      render();
    });
    const deleteServiceBtn = app.querySelector('[data-delete-service]');
    if(deleteServiceBtn) deleteServiceBtn.addEventListener('click', ()=>{
      if(!confirm('¿Eliminar este servicio? Los movimientos ya registrados no se borran.')) return;
      state.global.services = state.global.services.filter(s=>s.id!==deleteServiceBtn.getAttribute('data-delete-service'));
      saveGlobal();
      state.modal = { type:'settings' };
      render();
    });
  }

  loadAll();
  render();
})();
</script>
</body>
</html>
